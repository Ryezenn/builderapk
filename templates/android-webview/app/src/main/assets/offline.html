<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline fallback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
            color: #6366f1;
        }
        h2 {
            margin: 0 0 10px;
            font-size: 24px;
            font-weight: 700;
        }
        p {
            margin: 0 0 25px;
            color: #9ca3af;
            font-size: 14px;
            line-height: 1.6;
        }
        button {
            background-color: #6366f1;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📶</div>
        <h2>Connection Lost</h2>
        <p>This application requires an active internet connection. Please verify your Wi-Fi or cellular networks and try reloading.</p>
        <button onclick="window.location.reload()">Retry Connection</button>
    </div>
</body>
</html>
